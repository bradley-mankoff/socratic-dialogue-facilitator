name: fusion-plan-2lane
description: |
  Two-wide fused planning for peak-hours degradation (panel-a stood
  down). Panels b/c draft in parallel, judge fuses, fused plan emitted.
  Same mechanics as fusion-plan-3, minus the third lane.

nodes:
  - id: setup
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/plans"
      rm -rf "$ARTIFACTS_DIR"/plans/* "$ARTIFACTS_DIR"/fused-plan.md 2>/dev/null || true
      find . -name .git -prune -o -exec chmod a-w {} +

  - id: plan-b
    model: '@panel-b'
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [setup]
    prompt: |
      Independent planner. Write only $ARTIFACTS_DIR/plans/b/PLAN.md and NOTES.md.
      Request: $ARGUMENTS
      PLAN.md must be executable by someone who has not seen this chat.
      Do not touch the checkout.

  - id: plan-c
    model: '@panel-c'
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [setup]
    prompt: |
      Independent planner. Write only $ARTIFACTS_DIR/plans/c/PLAN.md and NOTES.md.
      Request: $ARGUMENTS
      PLAN.md must be executable by someone who has not seen this chat.
      Do not touch the checkout.

  - id: verify-clean
    bash: |
      set -euo pipefail
      DIRTY=$(git status --porcelain || true)
      if [ -n "$DIRTY" ]; then
        echo "PLAN ISOLATION VIOLATION:" >&2
        echo "$DIRTY" >&2
        exit 1
      fi
    depends_on: [plan-b, plan-c]

  - id: judge-plan
    command: fusion-judge-plan-fuse-forced
    model: '@judge'
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [verify-clean]
    output_format:
      type: object
      properties:
        verdict: { type: string }
        mode: { type: string, enum: [fuse] }
        chosen: { type: string, enum: [b, c] }
      required: [verdict, mode, chosen]

  - id: emit
    bash: |
      set -euo pipefail
      cat "$ARTIFACTS_DIR/fused-plan.md"
    depends_on: [judge-plan]
