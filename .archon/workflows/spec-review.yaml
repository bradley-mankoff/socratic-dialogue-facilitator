name: spec-review
description: One-shot heavy-reasoning review of a spec passed as the run message. Pure reasoning, no tools, no checkout mutations.
nodes:
  - id: review
    prompt: |
      You are a senior staff engineer reviewing a product spec before it is approved for implementation. Be adversarial where it counts and silent where it doesn't: every finding must cite the exact story number(s) or section it touches. No praise filler, no re-summary of the spec.

      SPEC UNDER REVIEW:
      $ARGUMENTS

      REVIEW BRIEF — check each of these and report ONLY what fails or needs change:
      1. Contradictions: any two stories/decisions that cannot both hold (e.g. vote-gating vs bypass hatch, facilitator roles across the two modes, universal franchise edge cases like 1-1 ties or single-participant rooms).
      2. Ambiguity that an implementer would have to guess at: untestable stories, missing thresholds (vote quorum with abstentions? META cap number? staleness-quote exact content?), undefined terms.
      3. Technical feasibility against the stated research verdicts: faster-whisper int8 streaming on Apple Silicon, pyannote + wespeaker enrollment binding, Wiktionary-first chain with 522-degradation, Cytoscape.js headless PNG export, Cloudflare Quick Tunnel (no SSE — does anything in the spec secretly need SSE?), browser mic capture over tunnel URL vs LAN plain-HTTP limits.
      4. SEP as labeled on-demand source: is the positioning (explicit-request-only, no API assumed) coherent with the rest of the search decisions?
      5. Scope discipline: anything in the 43 stories that belongs in Out of Scope, or anything in Out of Scope that a story smuggles back in.
      6. Testability: for each Testing Decision, is there a concrete seam? Flag stories with no observable acceptance.
      7. Missing stories: real user needs the spec forgot (think: error paths, empty states, first-run onboarding, what happens when the host's Mac sleeps mid-live-session, two boards same X, vote ties).

      OUTPUT SHAPE (markdown):
      ## Verdict
      One line: approve / approve-with-changes / needs-rework.
      ## Blockers
      Numbered, each: story/section refs, what's wrong, concrete fix.
      ## Major concerns
      Same shape, non-blocking but should-fix.
      ## Minor nits
      One line each, no elaboration.
      If a brief item is clean, say so in one line under Verdict context — do not pad sections.
    model: large
    effort: xhigh
    allowed_tools: []
